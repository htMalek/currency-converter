name: Deploy App
on:
  push:
    branches:
      - main

jobs:
  job1:
    name: Terraform Apply
    runs-on: ubuntu-latest
    outputs:
      instance_ip: ${{ steps.set-ip.outputs.instance_ip }}
    steps:
      - uses: actions/checkout@v3
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
      - name: Terraform Init
        run: cd terraform && terraform init
      - name: Terraform Apply
        id: apply
        run: |
          cd terraform
          terraform apply -auto-approve
          echo "ip=$(terraform output -raw instance_ip)" >> $GITHUB_OUTPUT
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ASIAQX7FQTY5C7HAX2SP }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.rBh0i9dKczOZEgRnOp6g9wse6CKkAInpKKT5qPop }}
          AWS_SESSION_TOKEN: ${{ secrets. }}
      - id: set-ip
        run: echo "instance_ip=${{ steps.apply.outputs.ip }}" >> $GITHUB_OUTPUT

  job2:
    name: Install Prerequisites
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - uses: actions/checkout@v3
      - name: Setup SSH and Install Packages
        uses: appleboy/ssh-action@master
        with:
          host: ${{ needs.job1.outputs.instance_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo apt-get update -y
            sudo apt-get install -y nodejs npm nginx
            sudo npm install -g pm2

  job3:
    name: Delivery & Production
    runs-on: ubuntu-latest
    needs: [job1, job2]
    steps:
      - uses: actions/checkout@v3
      - name: Deploy Frontend and Backend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ needs.job1.outputs.instance_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Clone ou mise à jour du code (simplifié pour l'exercice)
            mkdir -p ~/app
            # Ici on simule le transfert ou le pull
            # Lancement Backend
            cd ~/app/backend && npm install
            pm2 stop all || true
            pm2 start server.js --name "api"
            # Build Frontend
            cd ~/app/frontend && npm install && npm run build
            sudo cp -r dist/* /var/www/html/

      - name: Final URL
        run: echo "L'application est prête ici : http://${{ needs.job1.outputs.instance_ip }}"
