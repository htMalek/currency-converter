name: Deploy App
on:
  push:
    branches:
      - main

jobs:
  job1_terraform:
    name: "Provisionnement AWS"
    runs-on: ubuntu-latest
    outputs:
      instance_ip: ${{ steps.apply.outputs.ip }}
    steps:
      - uses: actions/checkout@v4 # Version plus récente
      - uses: hashicorp/setup-terraform@v3 # Version plus récente
      - name: Terraform Init & Apply
        id: apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: "us-east-1"
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve
          echo "ip=$(terraform output -raw instance_ip)" >> $GITHUB_OUTPUT

  job2_config:
    name: "Installation des packages"
    needs: job1_terraform
    runs-on: ubuntu-latest
    steps:
      - name: SSH Connection and Install
        uses: appleboy/ssh-action@master
        with:
          host: ${{ needs.job1_terraform.outputs.instance_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo apt-get update -y
            sudo apt-get install -y nodejs npm nginx
            sudo npm install -g pm2
